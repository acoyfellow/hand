name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Build the accessibility helper
        run: swiftc -O native/ax.swift -o native/ax
      - name: Install as a new user would, from the packed library
        run: |
          npm pack --silent --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/name.txt"
          sh scripts/fresh-install.sh "$RUNNER_TEMP/$(cat "$RUNNER_TEMP/name.txt")"

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun ../lab/site-gate.ts
